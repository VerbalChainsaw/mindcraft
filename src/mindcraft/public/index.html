<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mindcraft Control Center</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232196f3'/%3E%3Cpath d='M7 23V9h4l5 7 5-7h4v14h-4v-8l-5 6-5-6v8z' fill='white'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/console.css" />
  <script src="socket.io/socket.io.js"></script>
</head>
<body>
  <header class="app-header" aria-label="Mindcraft application header">
    <button id="mobileMenu" class="mobile-menu" type="button" aria-label="Toggle workspace navigation" aria-controls="primaryNav" aria-expanded="false">Menu</button>
    <div class="brand">MINDCRAFT</div>
    <div id="workspaceContext" class="header-context">Command Center</div>
    <nav id="primaryNav" class="primary-nav" aria-label="Primary workspace navigation">
      <span class="nav-section-label">Operate</span>
      <button class="nav-button" type="button" data-workspace="overview" aria-current="page"><span class="nav-label">Dashboard</span><span class="nav-detail">Command center</span></button>
      <button class="nav-button" type="button" data-workspace="server"><span class="nav-label">Server</span><span class="nav-detail">World and console</span></button>
      <button class="nav-button" type="button" data-workspace="agents"><span class="nav-label">Bots</span><span class="nav-detail">Agents and squads</span></button>
      <button class="nav-button" type="button" data-workspace="profiles"><span class="nav-label">Bot Profiles</span><span class="nav-detail">Characters and AI</span></button>
      <button class="nav-button" type="button" data-workspace="activity"><span class="nav-label">Activity</span><span class="nav-detail">Unified log</span></button>
      <details class="nav-advanced">
        <summary>Advanced</summary>
        <div class="nav-advanced-menu">
          <button class="nav-button" type="button" data-workspace="director"><span class="nav-label">Director</span><span class="nav-detail">Automated commands</span></button>
          <button class="nav-button" type="button" data-workspace="swarm"><span class="nav-label">Task Runners</span><span class="nav-detail">Host helpers</span></button>
        </div>
      </details>
    </nav>
    <div class="header-spacer"></div>
    <span id="serverStatus" class="server-status offline" role="status">● Control offline</span>
  </header>

  <div id="liveRegion" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <div class="app-layout">
    <div class="content-shell">
      <aside id="diagnostics" class="diagnostics" aria-label="System status"></aside>
      <main id="workspace" class="workspace" tabindex="-1" aria-live="polite"></main>
    </div>
  </div>

  <div id="modalRoot"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
